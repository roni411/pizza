<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍕 מתכון פיצה עם פוליש</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b03020">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="פיצה 🍕">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fdf6f0;
            color: #333;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #b03020, #e74c3c);
            color: white;
            padding: 1.5rem 1rem;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        header h1 { font-size: 1.9rem; margin-bottom: 0.2rem; }
        header p  { opacity: 0.8; font-size: 0.95rem; }

        .container {
            max-width: 820px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 1.4rem 1.6rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }

        .card h2 {
            color: #b03020;
            font-size: 1.15rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #fdecea;
        }

        /* ─── Inputs ─── */
        .inputs-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .input-group { flex: 1; min-width: 200px; }
        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 0.35rem;
        }
        input[type="number"], input[type="datetime-local"] {
            width: 100%;
            padding: 0.65rem 1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            direction: ltr;
            text-align: center;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #e74c3c; outline: none; }

        /* ─── Ingredients ─── */
        .ingredients-section {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .ingredient-table { flex: 1; min-width: 200px; }
        .ingredient-table h3 {
            font-size: 0.88rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #999;
            margin-bottom: 0.6rem;
        }
        .ingredient-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #f4f4f4;
        }
        .ingredient-name { color: #555; font-size: 0.95rem; }
        .ingredient-amount {
            font-weight: 700;
            color: #b03020;
            font-size: 1rem;
            direction: ltr;
        }

        /* ─── Timeline ─── */
        .timeline { display: flex; flex-direction: column; gap: 0.7rem; }
        .tl-event {
            display: flex;
            gap: 0.8rem;
            align-items: flex-start;
        }
        .tl-day-header {
            font-weight: 700;
            font-size: 1rem;
            color: #b03020;
            margin: 1rem 0 0.4rem;
            padding-bottom: 0.3rem;
            border-bottom: 2px solid #fdecea;
        }
        .tl-day-header:first-child { margin-top: 0; }
        .tl-time {
            background: #b03020;
            color: white;
            padding: 0.3rem 0.75rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.82rem;
            white-space: nowrap;
            min-width: 85px;
            text-align: center;
            direction: ltr;
            flex-shrink: 0;
        }
        .tl-time.highlight { background: #e67e22; }
        .tl-label { padding-top: 0.2rem; color: #444; font-size: 0.93rem; line-height: 1.45; }

        /* ─── Chat ─── */
        .chat-messages {
            height: 320px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 1rem;
            background: #fafafa;
            margin-bottom: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .empty-state {
            color: #bbb;
            text-align: center;
            margin: auto;
            font-size: 0.9rem;
        }
        .msg {
            max-width: 82%;
            display: flex;
            flex-direction: column;
        }
        .msg.user  { align-self: flex-end; align-items: flex-end; }
        .msg.model { align-self: flex-start; align-items: flex-start; }

        .bubble {
            padding: 0.65rem 1rem;
            border-radius: 14px;
            font-size: 0.93rem;
            line-height: 1.55;
            white-space: pre-wrap;
        }
        .msg.user  .bubble { background: #b03020; color: white; border-bottom-left-radius: 4px; }
        .msg.model .bubble { background: #efefef; color: #333; border-bottom-right-radius: 4px; }
        .bubble.error      { background: #fdecea; color: #b03020; }

        .msg img.thumb {
            max-width: 160px;
            border-radius: 8px;
            margin-bottom: 0.3rem;
        }

        .chat-controls {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
        }
        #chatInput {
            flex: 1;
            padding: 0.65rem 1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 0.93rem;
            font-family: inherit;
            resize: none;
            height: 58px;
            transition: border-color 0.2s;
        }
        #chatInput:focus { border-color: #e74c3c; outline: none; }

        .btn {
            padding: 0.6rem 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.93rem;
            font-weight: 600;
            transition: background 0.18s, opacity 0.18s;
            white-space: nowrap;
        }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-red  { background: #b03020; color: white; }
        .btn-red:not(:disabled):hover  { background: #962818; }
        .btn-grey { background: #eee; color: #555; }
        .btn-grey:not(:disabled):hover { background: #ddd; }

        #imagePreviewArea img {
            max-width: 140px;
            border-radius: 8px;
            margin: 0.4rem 0 0.2rem;
            border: 2px solid #ddd;
        }

        @media (max-width: 540px) {
            header h1 { font-size: 1.4rem; }
            .inputs-row { flex-direction: column; }
            .ingredients-section { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <h1>🍕 מתכון פיצה עם פוליש</h1>
    <p>בצק פיצה נפולטני — הכניסי כמות ושעה, כל השאר יחושב אוטומטית</p>
</header>

<div class="container">

    <!-- ── מחשבון ── -->
    <div class="card">
        <h2>⚙️ מחשבון</h2>
        <div class="inputs-row">
            <div class="input-group">
                <label for="numBalls">כמה כדורים? (כל כדור = 200 גרם)</label>
                <input type="number" id="numBalls" value="5" min="1" max="60">
            </div>
            <div class="input-group">
                <label for="pizzaTime">מתי אוכלים פיצה?</label>
                <input type="datetime-local" id="pizzaTime">
            </div>
        </div>
    </div>

    <!-- ── כמויות ── -->
    <div class="card">
        <h2>🧪 כמויות</h2>
        <div class="ingredients-section">
            <div class="ingredient-table">
                <h3>פוליש — שלב 1</h3>
                <div class="ingredient-row">
                    <span class="ingredient-name">קמח קפוטו פיצריה</span>
                    <span class="ingredient-amount" id="i-pf">—</span>
                </div>
                <div class="ingredient-row">
                    <span class="ingredient-name">מים קרים</span>
                    <span class="ingredient-amount" id="i-pw">—</span>
                </div>
                <div class="ingredient-row">
                    <span class="ingredient-name">שמרים יבשים</span>
                    <span class="ingredient-amount" id="i-py">—</span>
                </div>
            </div>
            <div class="ingredient-table">
                <h3>השלמת בצק — שלב 2</h3>
                <div class="ingredient-row">
                    <span class="ingredient-name">קמח קפוטו פיצריה</span>
                    <span class="ingredient-amount" id="i-df">—</span>
                </div>
                <div class="ingredient-row">
                    <span class="ingredient-name">מים קרים</span>
                    <span class="ingredient-amount" id="i-dw">—</span>
                </div>
                <div class="ingredient-row">
                    <span class="ingredient-name">מלח</span>
                    <span class="ingredient-amount" id="i-ds">—</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ── לוח זמנים ── -->
    <div class="card" id="timelineCard" style="display:none">
        <h2>📅 לוח זמנים</h2>
        <div class="timeline" id="timeline"></div>
    </div>

    <!-- ── ג'מיני ── -->
    <div class="card" style="text-align:center">
        <h2>🤖 ג'מיני</h2>
        <p style="color:#777; font-size:0.92rem; margin-bottom:1.2rem">לחצי לפתיחת השיחה עם ג'מיני — גם בטלפון וגם במחשב</p>
        <button onclick="openGemini()"
           style="display:inline-flex; align-items:center; gap:0.6rem; background:#b03020; color:white; border:none; cursor:pointer; padding:0.85rem 2rem; border-radius:12px; font-size:1.05rem; font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
            🤖 פתחי את ג'מיני
        </button>
    </div>

</div>

<script>
// כמויות מקוריות
const BASE = {
    poolishFlour: 300, poolishWater: 300, poolishYeast: 2.5,
    doughFlour:   700, doughWater:   350, doughSalt:   28
};
const BASE_TOTAL  = Object.values(BASE).reduce((a, b) => a + b, 0); // 1680.5g
const BALL_WEIGHT = 200;

// ═══════════════════════════════════════════
//  עזרים
// ═══════════════════════════════════════════
function rFlour(n) { return Math.ceil(n); }           // קמח ומים — מעלה למספר שלם
function r1(n)     { return Math.round(n * 10) / 10; } // שמרים ומלח — ספרה אחת

function fmt(date) {
    const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
    const p = n => String(n).padStart(2, '0');
    return `${p(date.getDate())}/${p(date.getMonth()+1)} ${p(date.getHours())}:${p(date.getMinutes())}`;
}

function fmtFull(date) {
    const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
    const p = n => String(n).padStart(2, '0');
    return `יום ${days[date.getDay()]} ${p(date.getDate())}/${p(date.getMonth()+1)} ${p(date.getHours())}:${p(date.getMinutes())}`;
}

function hoursAgo(T, h) {
    return new Date(T.getTime() - h * 3600 * 1000);
}

function toInputVal(date) {
    const p = n => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}`;
}

// ═══════════════════════════════════════════
//  חישוב כמויות
// ═══════════════════════════════════════════
function updateIngredients() {
    const n = Math.max(1, parseInt(document.getElementById('numBalls').value) || 8);
    const f = (n * BALL_WEIGHT) / BASE_TOTAL;

    // קמח ומים — מעוגלים כלפי מעלה למספר שלם
    const poolishFlour = rFlour(BASE.poolishFlour * f);
    const poolishWater = rFlour(BASE.poolishWater * f);
    const doughFlour   = rFlour(BASE.doughFlour   * f);
    const doughWater   = rFlour(BASE.doughWater   * f);
    // שמרים ומלח — מחושבים מחדש על בסיס הקמח המעוגל
    const yeast = r1(poolishFlour * (2.5 / 300));           // 0.833% מקמח הפוליש
    const salt  = r1((poolishFlour + doughFlour) * (28 / 1000)); // 2.8% מסך הקמח

    document.getElementById('i-pf').textContent = poolishFlour + ' גרם';
    document.getElementById('i-pw').textContent = poolishWater + ' גרם';
    document.getElementById('i-py').textContent = yeast + ' גרם';
    document.getElementById('i-df').textContent = doughFlour + ' גרם';
    document.getElementById('i-dw').textContent = doughWater + ' גרם';
    document.getElementById('i-ds').textContent = salt + ' גרם';
}

// ═══════════════════════════════════════════
//  לוח זמנים
// ═══════════════════════════════════════════
function updateTimeline() {
    const val = document.getElementById('pizzaTime').value;
    if (!val) { document.getElementById('timelineCard').style.display = 'none'; return; }

    const T = new Date(val);

    // לוח אירועים — עובדים לאחורה מ-T
    const events = [
        {
            time: hoursAgo(T, 49.5),
            label: 'מערבבים פוליש: קמח + מים + שמרים עד שאין גושים. משאירים בצנצנת שעה אחת בחוץ.',
        },
        {
            time: hoursAgo(T, 48.5),
            label: 'מכניסים פוליש למקרר — ל-16 עד 24 שעות.',
        },
        {
            time: hoursAgo(T, 28.5),
            label: 'שופכים למיקסר מים קרים + פוליש, מערבבים מעט. מוסיפים קמח ומלח. מפעילים עד שהבצק מתאחד. לא לעבור טמפרטורה של 23°C.',
        },
        {
            time: hoursAgo(T, 28),
            label: 'מעבירים לשיש, מקפלים לכדור. מנוחה של חצי שעה.',
        },
        {
            time: hoursAgo(T, 27.5),
            label: 'סדרת קיפולים לחיזוק הבצק. מכסים ומנוחה של שעה נוספת.',
        },
        {
            time: hoursAgo(T, 26),
            label: 'מחלקים לכדורים ומכניסים למקרר להתפחה של 24 שעות.',
        },
        {
            time: hoursAgo(T, 2),
            label: 'מוציאים כדורים מהמקרר לטמפרטורת החדר.',
        },
        {
            time: T,
            label: 'אוכלים פיצה!',
            highlight: true,
        },
    ];

    const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
    const p = n => String(n).padStart(2, '0');
    const dayKey   = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const dayEmojis = ['🫙', '⚙️', '🍕']; // יום 1 = פוליש, יום 2 = מיקסר, יום 3 = פיצה
    const dayLabel = (d, idx) => `${dayEmojis[idx] || ''} יום ${days[d.getDay()]} ${p(d.getDate())}/${p(d.getMonth()+1)}`;

    let html = '';
    let lastDay = null;
    let dayIndex = 0;
    for (const e of events) {
        const key = dayKey(e.time);
        if (key !== lastDay) {
            html += `<div class="tl-day-header">${dayLabel(e.time, dayIndex)}</div>`;
            lastDay = key;
            dayIndex++;
        }
        html += `
        <div class="tl-event">
            <div class="tl-time ${e.highlight ? 'highlight' : ''}">${p(e.time.getHours())}:${p(e.time.getMinutes())}</div>
            <div class="tl-label">${e.label}</div>
        </div>`;
    }
    document.getElementById('timeline').innerHTML = html;

    document.getElementById('timelineCard').style.display = 'block';
}

// ═══════════════════════════════════════════
//  אתחול
// ═══════════════════════════════════════════
(function init() {
    // ברירת מחדל: שישי הבא בשעה 19:00
    const now = new Date();
    const daysUntilFriday = (5 - now.getDay() + 7) % 7 || 7;
    const friday = new Date(now);
    friday.setDate(now.getDate() + daysUntilFriday);
    friday.setHours(19, 0, 0, 0);
    document.getElementById('pizzaTime').value = toInputVal(friday);

    updateIngredients();
    updateTimeline();
})();

document.getElementById('numBalls').addEventListener('input', updateIngredients);
document.getElementById('pizzaTime').addEventListener('input', updateTimeline);

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

function openGemini() {
    const url = 'https://gemini.google.com/u/1/app/e5d69c7c907aa143?pageId=none';
    const isAndroid = /android/i.test(navigator.userAgent);
    if (isAndroid) {
        // פתיחה ישירה באפליקציית Gemini
        const intent = `intent://${url.replace('https://', '')}#Intent;scheme=https;package=com.google.android.apps.bard;S.browser_fallback_url=${encodeURIComponent(url)};end`;
        window.location.href = intent;
    } else {
        window.open(url, '_blank');
    }
}
</script>
</body>
</html>
